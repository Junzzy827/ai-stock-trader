[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-trader"
version = "0.1.0"
description = "A safe, semi-automatic stock-trading research and paper-trading foundation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ai-stock-trader = "ai_stock_trader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
