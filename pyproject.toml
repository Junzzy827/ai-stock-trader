[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-trader"
version = "0.5.0"
description = "A safe, semi-automatic stock-trading research and paper-trading foundation."
requires-python = ">=3.11"  # tomllib
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["ai_stock_trader*"]

[tool.setuptools.package-data]
ai_stock_trader = ["api/dashboard.html"]

[project.scripts]
ai-stock-trader = "ai_stock_trader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
